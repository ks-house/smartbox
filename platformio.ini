[env:esp32-c6-devkitc-1]
; 공식 안정화 버전 대신, ESP32-C6와 Arduino 3.x를 완벽 지원하는 포크(Fork) 저장소를 직접 당겨옵니다.
platform = https://github.com/pioarduino/platform-espressif32.git#dd01e49e4695933bc29c1bf6be9a19a6572527a6
board = esp32-c6-devkitc-1
framework = arduino
extra_scripts = pre:scripts/git_version.py

; 시리얼 모니터 통신 속도
monitor_speed = 115200

; 컴파일 시 찌꺼기 에러를 방지하는 옵션
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB


; 라이브러리 의존성 추가
lib_deps =
    adafruit/Adafruit INA219 @ ^1.2.3
    Wire
    https://github.com/mathieucarbou/AsyncTCP.git
    elims/PsychicMqttClient @ ^0.2.1
    bblanchon/ArduinoJson @ ^7.0.4



[env:esp32-c6-test]
platform = https://github.com/pioarduino/platform-espressif32.git#dd01e49e4695933bc29c1bf6be9a19a6572527a6
board = esp32-c6-devkitc-1
framework = arduino
extra_scripts = pre:scripts/git_version.py
monitor_speed = 115200
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

lib_deps =
    adafruit/Adafruit INA219 @ ^1.2.3
    Wire
    https://github.com/mathieucarbou/AsyncTCP.git
    elims/PsychicMqttClient @ ^0.2.1
    bblanchon/ArduinoJson @ ^7.0.4

test_build_src = yes
build_flags = -DTARGET_TEST
build_src_filter =
    +<*>
    -<main.cpp>
    -<ConfigManager.cpp>
    -<WifiManager.cpp>

    -<AutoOtaManager.cpp>
    -<TelemetryManager.cpp>
    -<PowerManager.cpp>
    -<RemoteLogger.cpp>
    -<MqttManager.cpp>

[env:native]
platform = native
build_flags = -DNATIVE_BUILD
test_build_src = yes
build_src_filter =
    +<*>
    -<main.cpp>
    -<ConfigManager.cpp>
    -<WifiManager.cpp>

    -<Esp32Hardware.cpp>
    -<AutoOtaManager.cpp>
    -<TelemetryManager.cpp>
    -<PowerManager.cpp>
    -<RemoteLogger.cpp>
    -<MqttManager.cpp>




[env:esp32-c6-field-recovery]
extends = env:esp32-c6-devkitc-1
; Native USB field logs, no third-party UART bridge driver required.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
